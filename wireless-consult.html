<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>무선 상담</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#17191e;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:100%;max-width:680px;min-height:100vh;margin:auto;background:#fff}.head{padding:18px;border-bottom:1px solid #eceef1}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;cursor:pointer}.brand img{width:48px}.brand strong{font-size:18px}.back{padding:9px 12px;border-radius:10px;background:#f3f4f6;color:#333;text-decoration:none;font-size:12px;font-weight:800}.head p{margin:8px 0 0;color:#737883;font-size:12px}.content{padding:18px 18px 110px}.card{padding:16px;border:1px solid #e0e3e8;border-radius:15px}.grid{display:grid;gap:13px}.field label{display:block;margin-bottom:6px;color:#5f6570;font-size:12px;font-weight:800}.field input,.field select,.field textarea{width:100%;padding:0 12px;border:1px solid #d9dde4;border-radius:11px;background:#fff;font:inherit;outline:none}.field input,.field select{height:48px}.field textarea{min-height:110px;padding-top:12px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:#e31937;box-shadow:0 0 0 3px rgba(227,25,55,.08)}.bottom{position:fixed;left:50%;bottom:0;width:100%;max-width:680px;transform:translateX(-50%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #eceef1}.save{width:100%;height:54px;border:0;border-radius:12px;background:#e31937;color:#fff;font-size:15px;font-weight:900;cursor:pointer}.notice{margin-bottom:14px;padding:12px 13px;border-radius:11px;background:#f4f6f9;color:#666;font-size:12px;line-height:1.5}.toast{display:none;margin-bottom:12px;padding:12px;border-radius:11px;font-size:12px;font-weight:800}.toast.on{display:block}.toast.ok{background:#edfbf1;color:#117a37}.toast.err{background:#fff0f2;color:#c3152d}@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}.field.full{grid-column:1/-1}}
</style></head>
<body><main class="app">
<header class="head"><div class="top"><a class="brand" href="/" aria-label="홈으로 이동"><img src="assets/kt-logo.png" alt="KT"><strong>무선 상담</strong></a><a class="back" href="/">홈</a></div><p>모바일 고객 상담 내용을 빠르게 기록하는 화면입니다.</p></header>
<section class="content"><div id="toast" class="toast"></div><div class="notice">상담 내용을 입력하면 담당자에게 바로 전달됩니다.</div>
<div class="card"><div class="grid">
<div class="field full"><label>상담 사이트</label><select id="consultSite"><option value="">선택</option><option value="동구시장">동구시장</option></select></div>
<div class="field"><label>고객명</label><input id="name" placeholder="고객명"></div>
<div class="field"><label>연락처</label><input id="phone" inputmode="tel" placeholder="010-0000-0000"></div>
<div class="field"><label>현재 통신사</label><select id="carrier"><option value="">선택</option><option>KT</option><option>SKT</option><option>LG U+</option><option>알뜰폰</option></select></div>
<div class="field"><label>희망 모델</label><input id="wantedModel" placeholder="예: 아이폰 18 Pro"></div>\n<div class="field"><label>복지할인 선택</label><select id="welfare"><option value="">해당없음</option><option>기초생활수급자</option><option>장애인</option><option>차상위</option><option>기초연금</option><option>국가유공</option></select></div>
<div class="field"><label>희망 요금제</label><input id="plan" placeholder="요금제 또는 월 예상금액"></div>

<div class="field full"><label>상담 메모</label><textarea id="memo" placeholder="상담 내용, 재연락 일정, 특이사항 등"></textarea></div>
</div></div></section>
<div class="bottom"><button id="save" class="save" type="button">상담 내용 저장</button></div>
</main><script>
const ids=['consultSite','name','phone','carrier','wantedModel','welfare','plan','memo'];
const toast=document.getElementById('toast');
function msg(t,ok){toast.textContent=t;toast.className='toast on '+(ok?'ok':'err');window.scrollTo({top:0,behavior:'smooth'})}
document.getElementById('save').onclick=async()=>{const data={};ids.forEach(id=>data[id]=document.getElementById(id).value.trim());if(!data.consultSite)return msg('상담 사이트를 선택해주세요.',false);if(!data.name||!data.phone)return msg('고객명과 연락처를 입력해주세요.',false);const button=document.getElementById('save');button.disabled=true;button.textContent='접수 중...';try{const details=[data.consultSite&&'상담 사이트: '+data.consultSite,data.wantedModel&&'희망 모델: '+data.wantedModel,data.welfare&&'복지할인: '+data.welfare,data.plan&&'희망 요금제: '+data.plan,data.memo&&'메모: '+data.memo].filter(Boolean).join(' / ');const response=await fetch('https://kt-dong-bu.vercel.app/api/consult',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:'상담신청',name:data.name,phone:data.phone,product:'무선 상담',carrier:data.carrier,message:details})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.success)throw new Error(result.message||'접수에 실패했습니다.');msg('무선 상담이 접수되었습니다. 담당자에게 알림을 전송했습니다.',true)}catch(error){msg(error.message||'접수 중 오류가 발생했습니다.',false)}finally{button.disabled=false;button.textContent='상담 내용 저장'}};
</script></body></html>
