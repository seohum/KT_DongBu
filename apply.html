<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KT 유선 전자가입신청</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f3f4f6;color:#171717;min-height:100vh}.page{width:100%;max-width:430px;min-height:100vh;margin:0 auto;background:#fff}.header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #eceef1}.brand{display:flex;align-items:center;gap:10px}.brand img{width:51px;height:34px;object-fit:contain}.brand span{font-size:15px;font-weight:850}.home{color:#60646c;text-decoration:none;font-size:13px;font-weight:700}.hero{padding:31px 22px 23px;background:linear-gradient(150deg,#fff 25%,#fff5f6)}.eyebrow{color:#e31937;font-size:12px;font-weight:850;margin-bottom:10px}.hero h1{font-size:27px;line-height:1.28;letter-spacing:-1.3px;margin-bottom:9px}.hero p{font-size:14px;line-height:1.6;color:#62666e}.content{padding:20px 18px 36px}.section{border:1px solid #e1e4e8;border-radius:18px;padding:20px 17px;margin-bottom:15px;background:#fff;box-shadow:0 7px 22px rgba(15,23,42,.055)}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:17px}.icon{width:44px;height:44px;border-radius:13px;background:#fff0f2;color:#e31937;display:grid;place-items:center;font-size:21px}.section-head strong{display:block;font-size:19px}.section-head span{font-size:12px;color:#737780}.label{display:block;font-size:12px;color:#555b64;font-weight:800;margin:15px 0 8px}.options{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.direct,.choice{min-height:57px;border:1px solid #d9dde3;border-radius:11px;background:#fff;color:#25272b;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:7px 3px;font:inherit;cursor:pointer}.direct:active,.choice:active{transform:scale(.98)}.direct b,.choice b{font-size:13px}.direct small,.choice small{display:block;color:#81858c;font-size:10px;margin-top:2px}.choice.selected{border:2px solid #e31937;background:#fff5f6;color:#d41130}.choice.selected small{color:#b83247}.continue{width:100%;height:50px;margin-top:16px;border:0;border-radius:12px;background:#171717;color:#fff;font-size:15px;font-weight:850;cursor:pointer}.continue:disabled{background:#c9cdd3;color:#f4f4f5;cursor:not-allowed}.summary{display:none;margin-top:13px;padding:11px 12px;background:#f7f7f8;border-radius:10px;font-size:12px;line-height:1.5;color:#555}.summary.active{display:block}.notice{margin-top:20px;border-radius:14px;background:#f7f7f8;padding:15px 16px;color:#6a6e75;font-size:12px;line-height:1.65}.notice strong{display:block;color:#333;margin-bottom:3px}.footer{text-align:center;color:#9a9da3;font-size:11px;padding:0 16px 27px}
</style>
</head>
<body><main class="page">
<header class="header"><div class="brand"><img src="assets/01_KT%20Wordmark%20(Standard)_01.png" alt="KT 공식 로고"><span>동부법인지사</span></div><a class="home" href="./">홈으로</a></header>
<section class="hero"><div class="eyebrow">● KT 공식 유선 전자가입신청</div><h1>가입하실 상품을<br>선택해주세요</h1><p>선택한 상품 구성은 전자가입신청서에 자동으로 표시됩니다.</p></section>
<section class="content">
<div class="section"><div class="section-head"><div class="icon">⌁</div><div><strong>인터넷</strong><span>인터넷 단독 가입신청</span></div></div><span class="label">인터넷 상품</span><div class="options">
<a class="direct" href="application.html?product=%EC%9D%B8%ED%84%B0%EB%84%B7&amp;details=%EC%9D%B8%ED%84%B0%EB%84%B7%20%2F%20%EC%8A%AC%EB%A6%BC%20100M"><b>슬림</b><small>100M</small></a>
<a class="direct" href="application.html?product=%EC%9D%B8%ED%84%B0%EB%84%B7&amp;details=%EC%9D%B8%ED%84%B0%EB%84%B7%20%2F%20%EB%B2%A0%EC%9D%B4%EC%A7%81%20500M"><b>베이직</b><small>500M</small></a>
<a class="direct" href="application.html?product=%EC%9D%B8%ED%84%B0%EB%84%B7&amp;details=%EC%9D%B8%ED%84%B0%EB%84%B7%20%2F%20%EC%97%90%EC%84%BC%EC%8A%A4%201G"><b>에센스</b><small>1G</small></a>
</div></div>
<div class="section"><div class="section-head"><div class="icon">▣</div><div><strong>인터넷 + TV</strong><span>인터넷·지니 TV 결합 가입신청</span></div></div>
<span class="label">1. 인터넷 상품</span><div class="options" id="internetOptions"><button class="choice" data-value="슬림 100M"><b>슬림</b><small>100M</small></button><button class="choice" data-value="베이직 500M"><b>베이직</b><small>500M</small></button><button class="choice" data-value="에센스 1G"><b>에센스</b><small>1G</small></button></div>
<span class="label">2. TV 상품</span><div class="options" id="tvOptions"><button class="choice" data-value="지니 TV 라이트"><b>라이트</b><small>TV 상품</small></button><button class="choice" data-value="지니 TV 베이직"><b>베이직</b><small>TV 상품</small></button><button class="choice" data-value="지니 TV 에센스"><b>에센스</b><small>TV 상품</small></button></div>
<div class="summary" id="summary"></div><button class="continue" id="continueBtn" disabled>상품 선택 후 신청서 작성</button></div>
<div class="notice"><strong>안전한 전자신청 안내</strong>작성된 신청서는 관리자 시스템으로 안전하게 접수되며, 접수 완료 알림이 전송됩니다.</div>
</section><footer class="footer">KT 동부법인지사 · 유선 전자가입신청</footer></main>
<script>
let selectedInternet='',selectedTv='';
function bindOptions(id,type){document.querySelectorAll('#'+id+' .choice').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('#'+id+' .choice').forEach(item=>item.classList.remove('selected'));button.classList.add('selected');if(type==='internet')selectedInternet=button.dataset.value;else selectedTv=button.dataset.value;updateSelection()}))}
function updateSelection(){const ready=selectedInternet&&selectedTv,summary=document.getElementById('summary'),button=document.getElementById('continueBtn');button.disabled=!ready;if(ready){summary.textContent='선택 상품: 인터넷 '+selectedInternet+' + '+selectedTv;summary.classList.add('active')}else summary.classList.remove('active')}
bindOptions('internetOptions','internet');bindOptions('tvOptions','tv');
document.getElementById('continueBtn').addEventListener('click',()=>{if(!selectedInternet||!selectedTv)return;const details='인터넷+TV / 인터넷 '+selectedInternet+' / '+selectedTv;location.href='application.html?product='+encodeURIComponent('인터넷+TV')+'&details='+encodeURIComponent(details)});
</script></body></html>
