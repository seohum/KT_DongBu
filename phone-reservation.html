<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KT M&S 동부법인지사 | 휴대폰 사전예약</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef0f3;color:#17191e;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:430px;min-height:100vh;margin:auto;background:#fff;box-shadow:0 0 35px rgba(0,0,0,.06)}.header{height:66px;padding:0 17px;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.98);border-bottom:1px solid #eee}.header img{width:52px;height:31px;object-fit:contain}.branch{font-size:17px;font-weight:900;letter-spacing:-.6px}.hero{padding:28px 20px 25px;background:linear-gradient(145deg,#fff 0%,#fff 55%,#f4f7fb 100%);border-bottom:1px solid #eee}.badge{display:inline-flex;padding:6px 10px;border-radius:999px;background:#fff0f2;color:#e31937;font-size:11px;font-weight:900}.hero h1{margin:11px 0 7px;font-size:28px;letter-spacing:-1px}.hero p{margin:0;color:#6f747d;font-size:13px;line-height:1.55}.content{padding:18px 18px 100px}.card{margin-bottom:14px;padding:17px;border:1px solid #e6e7eb;border-radius:17px;background:#fff;box-shadow:0 3px 14px rgba(0,0,0,.035)}.card h2{margin:0 0 14px;font-size:16px}.field{margin-bottom:14px}.field:last-child{margin-bottom:0}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:800}.req{color:#e31937}.field input,.field select{width:100%;height:49px;padding:0 13px;border:1px solid #d9dce2;border-radius:11px;background:#fff;font:inherit;font-size:15px;outline:none}.field input:focus,.field select:focus{border-color:#e31937;box-shadow:0 0 0 3px rgba(227,25,55,.08)}.types{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.types button{height:50px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit;font-weight:900}.types button.on{border-color:#e31937;background:#fff1f3;color:#e31937}.notice{padding:13px;border-radius:11px;background:#f7f7f8;color:#6e737d;font-size:12px;line-height:1.6}.agree{display:flex;gap:9px;align-items:flex-start;margin-top:14px;font-size:12px;line-height:1.5}.agree input{width:18px;height:18px;accent-color:#e31937;flex:none}.submit{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);border-top:1px solid #eee}.submit button{width:100%;height:54px;border:0;border-radius:14px;background:#e31937;color:#fff;font:inherit;font-size:16px;font-weight:900}.hidden{display:none!important}.done{display:none;text-align:center;padding:60px 25px}.done .check{display:flex;align-items:center;justify-content:center;width:70px;height:70px;margin:0 auto 20px;border-radius:50%;background:#e31937;color:#fff;font-size:34px}.done h2{font-size:24px}.done p{color:#6f747d;line-height:1.6}.summary{margin-top:20px;padding:16px;text-align:left;background:#f7f7f8;border-radius:14px;font-size:13px;line-height:1.8}.newBtn{margin-top:20px;width:100%;height:50px;border:1px solid #ddd;border-radius:12px;background:#fff;font:inherit;font-weight:800}
</style></head>
<body><main class="app"><div id="formPage"><header class="header"><img src="assets/kt-logo.png" alt="KT"><div class="branch">KT M&S 동부법인지사</div></header><section class="hero"><span class="badge">휴대폰 사전예약</span><h1>사전예약 신청</h1><p>원하시는 모델과 가입 유형을 선택해 사전예약 정보를 등록해주세요.</p></section><div class="content"><section class="card"><h2>판매자 정보</h2><div class="field"><label>판매자 이름 <span class="req">*</span></label><input id="seller" autocomplete="name" placeholder="판매자 이름"></div></section><section class="card"><h2>가입 유형</h2><div class="types"><button type="button" data-type="신규" class="on">신규</button><button type="button" data-type="번호이동">번호이동</button><button type="button" data-type="기기변경">기기변경</button></div></section><section class="card"><h2>고객 정보</h2><div class="field"><label>고객명 <span class="req">*</span></label><input id="name" autocomplete="name" placeholder="고객명"></div><div class="field"><label>생년월일 <span class="req">*</span></label><input id="birth" inputmode="numeric" maxlength="8" placeholder="예: 19900101"></div><div class="field"><label>전화번호 <span class="req">*</span></label><input id="phone" type="tel" inputmode="tel" placeholder="010-0000-0000"></div><div class="field hidden" id="carrierField"><label>현재 통신사 <span class="req">*</span></label><select id="carrier"><option value="">통신사를 선택해주세요</option><option>SKT</option><option>LG U+</option><option>알뜰폰</option></select></div><div class="field"><label>현재 사용 기종 <span class="req">*</span></label><input id="currentModel" placeholder="예: 갤럭시 S24 / 아이폰 16"></div></section><section class="card"><h2>사전예약 제품</h2><div class="field"><label>사전예약 모델명 <span class="req">*</span></label><select id="model"></select></div><div class="field"><label>색상 <span class="req">*</span></label><select id="color"></select></div><div class="field"><label>용량 <span class="req">*</span></label><select id="capacity"></select></div></section><section class="card"><div class="notice">입력하신 정보는 휴대폰 사전예약 상담 및 접수를 위한 용도로 사용됩니다. 현재 페이지는 테스트 버전으로 서버에 개인정보를 전송하거나 저장하지 않습니다.</div><label class="agree"><input id="agree" type="checkbox"><span><b>개인정보 수집·이용에 동의합니다.</b><br>수집항목: 판매자명, 고객명, 생년월일, 전화번호, 통신사, 기종 및 사전예약 제품 정보</span></label></section></div><div class="submit"><button id="submitBtn" type="button">사전예약 접수하기</button></div></div><section class="done" id="done"><div class="check">✓</div><h2>사전예약 정보 확인 완료</h2><p>입력한 내용을 아래에서 확인해주세요.<br>현재 테스트 버전에서는 서버에 저장되지 않습니다.</p><div class="summary" id="summary"></div><button class="newBtn" onclick="location.reload()">새로 작성하기</button></section></main>
<script>
const PRODUCTS=[{name:'직접 선택 / 추후 입력',colors:['미정'],capacities:['미정']},{name:'신제품 모델 A',colors:['블랙','화이트','기타'],capacities:['128GB','256GB','512GB','1TB']},{name:'신제품 모델 B',colors:['블랙','화이트','기타'],capacities:['128GB','256GB','512GB','1TB']}];
const $=id=>document.getElementById(id);let type='신규';
function fillModels(){$('model').innerHTML='<option value="">모델을 선택해주세요</option>'+PRODUCTS.map((p,i)=>`<option value="${i}">${p.name}</option>`).join('');$('color').innerHTML='<option value="">모델을 먼저 선택해주세요</option>';$('capacity').innerHTML='<option value="">모델을 먼저 선택해주세요</option>'}
function productChanged(){const p=PRODUCTS[+$('model').value];if(!p){$('color').innerHTML='<option value="">모델을 먼저 선택해주세요</option>';$('capacity').innerHTML='<option value="">모델을 먼저 선택해주세요</option>';return}$('color').innerHTML='<option value="">색상을 선택해주세요</option>'+p.colors.map(x=>`<option>${x}</option>`).join('');$('capacity').innerHTML='<option value="">용량을 선택해주세요</option>'+p.capacities.map(x=>`<option>${x}</option>`).join('')}
document.querySelectorAll('.types button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.types button').forEach(x=>x.classList.remove('on'));b.classList.add('on');type=b.dataset.type;$('carrierField').classList.toggle('hidden',type!=='번호이동')});$('model').addEventListener('change',productChanged);$('phone').addEventListener('input',e=>{let v=e.target.value.replace(/\D/g,'').slice(0,11);if(v.length>7)v=v.replace(/(\d{3})(\d{4})(\d+)/,'$1-$2-$3');else if(v.length>3)v=v.replace(/(\d{3})(\d+)/,'$1-$2');e.target.value=v});$('birth').addEventListener('input',e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,8));
$('submitBtn').onclick=()=>{const required=[['seller','판매자 이름'],['name','고객명'],['birth','생년월일'],['phone','전화번호'],['currentModel','현재 사용 기종'],['model','사전예약 모델'],['color','색상'],['capacity','용량']];if(type==='번호이동')required.splice(4,0,['carrier','현재 통신사']);for(const [id,label] of required){if(!$(id).value.trim()){alert(label+'을(를) 입력해주세요.');$(id).focus();return}}if($('birth').value.length!==8){alert('생년월일을 8자리로 입력해주세요.');$('birth').focus();return}if(!$('agree').checked){alert('개인정보 수집·이용에 동의해주세요.');return}const p=PRODUCTS[+$('model').value];const rows=[['판매자',$('seller').value],['가입유형',type],['고객명',$('name').value],['생년월일',$('birth').value],['전화번호',$('phone').value]];if(type==='번호이동')rows.push(['현재 통신사',$('carrier').value]);rows.push(['현재 기종',$('currentModel').value],['사전예약 모델',p.name],['색상',$('color').value],['용량',$('capacity').value]);$('summary').innerHTML=rows.map(x=>`<div><b>${x[0]}</b> : ${x[1]}</div>`).join('');$('formPage').style.display='none';$('done').style.display='block';window.scrollTo(0,0)};fillModels();
</script></body></html>
