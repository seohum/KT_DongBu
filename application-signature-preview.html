<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>전자신청 자필 성명·서명 미리보기</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:#16181d;font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:#fff}.head{position:sticky;top:0;z-index:10;padding:15px 18px 12px;background:#fff;border-bottom:1px solid #eceef1}.head-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:9px}.logo{width:52px;height:auto}.brand strong{font-size:16px}.badge{padding:7px 9px;border-radius:999px;background:#fff0f2;color:#e31937;font-size:11px;font-weight:900}.head p{margin:6px 0 0;font-size:11px;color:#727780}.progress{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:12px}.progress span{height:4px;border-radius:9px;background:#e31937}.content{padding:20px 18px 120px}.eyebrow{margin:0 0 7px;font-size:12px;font-weight:900;color:#e31937}.title{margin:0 0 7px;font-size:23px;line-height:1.25}.desc{margin:0 0 22px;color:#6d727b;font-size:13px;line-height:1.6}.canvas-wrap{border:1px solid #d9dde4;border-radius:14px;overflow:hidden;background:#fff}.canvas-wrap+.canvas-wrap{margin-top:12px}.canvas-top{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f6f7f9;font-size:12px;font-weight:800}.clear{min-height:34px;border:0;background:none;color:#e31937;font-weight:900;cursor:pointer}.sig{display:block;width:100%;height:185px;touch-action:none}.name-mark{height:130px}.consent{display:flex;gap:12px;padding:14px 0;margin-top:4px}.consent input{width:24px;height:24px;min-width:24px;margin:1px 0 0;accent-color:#e31937}.consent b{display:block;font-size:15px}.consent span span{display:block;margin-top:4px;color:#6f747d;font-size:11px;line-height:1.45}.security{padding:14px;border-radius:12px;background:#fff4f5;color:#6a343b;font-size:12px;line-height:1.55}.bottom{position:fixed;left:50%;bottom:0;z-index:20;width:100%;max-width:430px;transform:translateX(-50%);padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);border-top:1px solid #eceef1}.confirm{width:100%;min-height:50px;border:0;border-radius:13px;background:#e31937;color:#fff;font:inherit;font-size:14px;font-weight:900}.toast{position:fixed;left:50%;bottom:92px;z-index:30;transform:translate(-50%,20px);opacity:0;padding:11px 15px;border-radius:999px;background:#202227;color:#fff;font-size:12px;transition:.2s;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main class="app">
  <header class="head">
    <div class="head-top"><div class="brand"><img class="logo" src="assets/01_KT%20Wordmark%20(Standard)_01.png" alt="KT"><strong>유선 전자신청서</strong></div><span class="badge">미리보기</span></div>
    <p>제출되지 않는 화면 확인용 페이지입니다.</p>
    <div class="progress"><span></span><span></span><span></span><span></span><span></span></div>
  </header>
  <section class="content">
    <p class="eyebrow">4. 자필 성명 및 전자서명</p>
    <h1 class="title">성명과 서명을 각각 작성해주세요</h1>
    <p class="desc">자필 성명은 신청서의 이름 칸에, 서명은 서명(인) 칸에 각각 적용됩니다.</p>
    <div class="canvas-wrap">
      <div class="canvas-top"><span>신청자 성명 자필 작성</span><button type="button" class="clear" data-clear="applicantNameMark">다시 쓰기</button></div>
      <canvas class="sig name-mark" id="applicantNameMark"></canvas>
    </div>
    <div class="canvas-wrap">
      <div class="canvas-top"><span>가입자 본인 서명</span><button type="button" class="clear" data-clear="signature">다시 쓰기</button></div>
      <canvas class="sig" id="signature"></canvas>
    </div>
    <label class="consent"><input id="agree" type="checkbox"><span><b>서명 적용에 동의합니다</b><span>위 자필 성명과 서명을 신청·동의 서명란에 적용하는 것에 동의합니다.</span></span></label>
    <div class="security">이 미리보기에서는 작성 내용이 저장되거나 전송되지 않습니다.</div>
  </section>
</main>
<div class="bottom"><button type="button" class="confirm" id="confirm">미리보기 확인</button></div>
<div class="toast" id="toast"></div>
<script>
const pads=new Map();
function hasInk(canvas,ctx){const pixels=ctx.getImageData(0,0,canvas.width,canvas.height).data;for(let i=3;i<pixels.length;i+=4)if(pixels[i]>0)return true;return false}
function bindPad(canvas){const ctx=canvas.getContext('2d');let drawing=false;function resize(){const rect=canvas.getBoundingClientRect(),old=canvas.toDataURL(),ink=canvas.width&&canvas.height&&hasInk(canvas,ctx);canvas.width=Math.round(rect.width*devicePixelRatio);canvas.height=Math.round(rect.height*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#111';if(ink){const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,rect.width,rect.height);img.src=old}}function point(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}canvas.addEventListener('pointerdown',e=>{drawing=true;canvas.setPointerCapture?.(e.pointerId);const p=point(e);ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x+.1,p.y+.1);ctx.stroke();e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()});canvas.addEventListener('pointerup',()=>drawing=false);canvas.addEventListener('pointercancel',()=>drawing=false);resize();return{canvas,ctx,resize,clear(){ctx.clearRect(0,0,canvas.width,canvas.height)}}}
document.querySelectorAll('canvas').forEach(canvas=>pads.set(canvas.id,bindPad(canvas)));
document.querySelectorAll('[data-clear]').forEach(button=>button.onclick=()=>pads.get(button.dataset.clear).clear());
window.addEventListener('resize',()=>pads.forEach(pad=>pad.resize()));
function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),1800)}
document.getElementById('confirm').onclick=()=>{if(!hasInk(pads.get('applicantNameMark').canvas,pads.get('applicantNameMark').ctx))return toast('신청자 성명을 작성해주세요.');if(!hasInk(pads.get('signature').canvas,pads.get('signature').ctx))return toast('서명을 작성해주세요.');if(!document.getElementById('agree').checked)return toast('서명 적용 동의를 체크해주세요.');toast('화면 확인이 완료됐습니다.')};
</script>
</body>
</html>
