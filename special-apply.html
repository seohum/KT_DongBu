<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KT 아파트·오피스텔 특판 전자가입신청</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:#f3f4f6;color:#171717}.page{width:100%;max-width:430px;min-height:100vh;margin:auto;background:#fff}.header{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid #eceef1}.brand{display:flex;align-items:center;gap:10px}.brand img{width:51px}.brand span{font-size:15px;font-weight:850}.home{color:#60646c;text-decoration:none;font-size:13px;font-weight:700}.hero{padding:32px 22px 26px;background:linear-gradient(145deg,#fff 25%,#fff0f2)}.badge{display:inline-block;padding:6px 10px;border-radius:999px;background:#e31937;color:#fff;font-size:11px;font-weight:900;margin-bottom:13px}.hero h1{font-size:27px;line-height:1.28;letter-spacing:-1.2px}.hero p{margin-top:9px;font-size:14px;line-height:1.6;color:#62666e}.site{margin-top:15px;padding:12px 14px;border:1px solid #f2c8cf;border-radius:12px;background:#fff;font-size:13px}.site b{color:#d41130}.content{padding:20px 18px 36px}.card{border:1px solid #e1e4e8;border-radius:18px;padding:20px 17px;margin-bottom:15px;box-shadow:0 7px 22px rgba(15,23,42,.055)}.title{display:flex;align-items:center;gap:11px;margin-bottom:14px}.icon{width:54px;height:48px;border:1px solid #eceef1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center}.icon img{width:31px}.icon b{font-size:9px}.title strong{font-size:19px}.title span{display:block;color:#777;font-size:12px;margin-top:2px}.product{padding:14px;border-radius:12px;background:#f7f7f8;line-height:1.65;font-size:13px}.product b{color:#d41130}.wifi{display:flex;align-items:center;gap:10px;margin-top:13px;padding:12px;border:1px solid #dfe3e8;border-radius:12px;font-size:13px;font-weight:800}.wifi input{width:21px;height:21px;accent-color:#e31937}.wifi small{margin-left:auto;color:#e31937}.apply{width:100%;height:52px;margin-top:14px;border:0;border-radius:12px;background:#171717;color:#fff;font-size:15px;font-weight:900}.notice{padding:15px 16px;border-radius:14px;background:#f7f7f8;color:#676b72;font-size:12px;line-height:1.65}.footer{text-align:center;color:#999;font-size:11px;padding:0 16px 27px}</style></head>
<body><main class="page"><header class="header"><div class="brand"><img src="assets/01_KT%20Wordmark%20(Standard)_01.png" alt="KT 공식 로고"><span>동부법인지사</span></div><a class="home" href="./">홈으로</a></header>
<section class="hero"><span class="badge">아파트·오피스텔 입주 특판</span><h1>특판 전용<br>전자 가입신청</h1><p>특판 기준 상품을 확인하고 바로 전자가입신청서를 작성할 수 있습니다.</p><div class="site">접수 단지: <b id="siteName">아파트·오피스텔 특판</b></div></section>
<section class="content"><div class="card"><div class="title"><div class="icon"><img src="assets/01_KT%20Wordmark%20(Standard)_01.png" alt="KT"><b>인터넷</b></div><div><strong>인터넷 단독</strong><span>특판 기준 상품</span></div></div><div class="product"><b>인터넷 슬림 100M</b><br>3년 약정 기준</div><label class="wifi"><input id="wifiInternet" type="checkbox">와이파이 패키지<small>월 1,100원</small></label><button class="apply" data-kind="internet">인터넷 가입신청</button></div>
<div class="card"><div class="title"><div class="icon"><img src="assets/01_KT%20Wordmark%20(Standard)_01.png" alt="KT"><b>지니TV</b></div><div><strong>인터넷 + TV</strong><span>특판 기준 결합 상품</span></div></div><div class="product"><b>인터넷 슬림 100M</b><br>지니 TV 베이직 · 3년 약정 기준</div><label class="wifi"><input id="wifiBundle" type="checkbox">와이파이 패키지<small>월 1,100원</small></label><button class="apply" data-kind="bundle">인터넷 + TV 가입신청</button></div>
<div class="notice"><strong>안전한 전자신청 안내</strong><br>작성된 신청서는 기존 관리자 시스템과 텔레그램 알림으로 동일하게 접수됩니다.</div></section><footer class="footer">KT 동부법인지사 · 특판 전용 전자가입신청</footer></main>
<script>const params=new URLSearchParams(location.search),site=params.get('site')||'';const sites={'mark-palace':'범어 마크팰리스','dongdaegu-boutique-terrace':'동대구 부띠끄테라스'};document.getElementById('siteName').textContent=sites[site]||'아파트·오피스텔 특판';function wifiText(id){return document.getElementById(id).checked?'와이파이 패키지 포함 (+1,100원/월)':'와이파이 패키지 미포함'}document.querySelectorAll('.apply').forEach(button=>button.addEventListener('click',()=>{const bundle=button.dataset.kind==='bundle';const product=bundle?'인터넷+TV':'인터넷';const details=bundle?'아파트/오피스텔 특판 / 인터넷 슬림 100M / 지니 TV 베이직 / '+wifiText('wifiBundle'):'아파트/오피스텔 특판 / 인터넷 슬림 100M / '+wifiText('wifiInternet');const q=new URLSearchParams({product,details});if(site)q.set('site',site);location.href='application.html?'+q.toString()}));</script></body></html>
